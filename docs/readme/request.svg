<g id="c0" class="cap"><circle cx="64" cy="455" r="6" fill="#d67a84"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">“Which campaign has the worst cost per sale?”</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">typed into the Chat page</text></g><g id="c1" class="cap"><circle cx="64" cy="455" r="6" fill="#d67a84"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">The dashboard forwards it; it holds no keys</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">POST /ask/stream</text></g><g id="c2" class="cap"><circle cx="64" cy="455" r="6" fill="#d67a84"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Key and rate limit checked</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">X-API-Key ✓ · 20 requests / min</text></g><g id="c3" class="cap"><circle cx="64" cy="455" r="6" fill="#479650"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Not an injection, and in scope</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">regex rules ✓ · optional classifier</text></g><g id="c4" class="cap"><circle cx="64" cy="455" r="6" fill="#d67a84"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">A free model picks a tool and writes SQL</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">free model → next free model → openrouter/free</text></g><g id="c5" class="cap"><circle cx="64" cy="455" r="6" fill="#d67a84"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Tool: run_sql</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">also get_anomalies · get_forecast · get_budget_plan · render_chart</text></g><g id="c6" class="cap"><circle cx="64" cy="455" r="6" fill="#479650"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">One read-only SELECT on allow-listed tables</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">LIMIT ≤ 100 · ≤ 10 MB billed · 30 s timeout</text></g><g id="c7" class="cap"><circle cx="64" cy="455" r="6" fill="#db6141"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">BigQuery: Unrecognized name: cpa</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">returned to the model as a structured hint, not a crash</text></g><g id="c8" class="cap"><circle cx="64" cy="455" r="6" fill="#e0a458"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">The model repairs its own query</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">self-repair · at most 3 queries, 4 model calls</text></g><g id="c9" class="cap"><circle cx="64" cy="455" r="6" fill="#d67a84"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Tool: run_sql</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">second attempt</text></g><g id="c10" class="cap"><circle cx="64" cy="455" r="6" fill="#479650"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Guard passes again</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">read-only ✓ · capped ✓</text></g><g id="c11" class="cap"><circle cx="64" cy="455" r="6" fill="#479650"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Rows back</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">campaign · spend · conversions · cost per sale</text></g><g id="c12" class="cap"><circle cx="64" cy="455" r="6" fill="#479650"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Secrets and personal data scrubbed</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">output rail</text></g><g id="c13" class="cap final"><circle cx="64" cy="455" r="6" fill="#479650"/><text x="82" y="461" font-size="19" font-weight="600" fill="#fffdf9">Search_Generic_Terms: $24.80 per sale vs $9.75 average</text><text x="82" y="488" class="mono" font-size="13.5" fill="#a89f92">answer + chart within 100 s · audit row → BigQuery adpilot_audit</text></g>
</svg>
