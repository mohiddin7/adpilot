name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q
      - run: adpilot eval --check-cases
      - run: adpilot eval --tier deterministic --out .adpilot/evals
