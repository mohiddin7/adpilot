name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q
      - run: adpilot eval --check-cases
      - run: adpilot eval --tier deterministic --out .adpilot/evals

  # `test` above stays the one required check (Python 3.11, the floor and the Docker image). pyproject.toml also
  # declares 3.12 and 3.13, so this proves them without renaming that check.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: adpilot eval --check-cases
