name: brief-daily
on:
  schedule:
    - cron: "0 12 * * *"  # 9 h after evals-nightly (03:00), which shares the free-tier model quota
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Audit preflight
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: adpilot audit preflight
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      - name: Write the brief
        id: brief
        env:
          AGENT_LLM_BEARER_TOKEN: ${{ secrets.AGENT_LLM_BEARER_TOKEN }}
          AGENT_LLM_MODELS: ${{ vars.AGENT_LLM_MODELS }}  # repository variable; unset = the chain in code
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          ADPILOT_INPUT_CLASSIFIER: ${{ secrets.JEV_API_KEY != '' && 'jev' || '' }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          ADPILOT_CONNECTOR: bigquery
          BQ_STAGING_DATASET: ${{ secrets.BQ_STAGING_DATASET }}
          BQ_PRODUCTION_DATASET: ${{ secrets.BQ_PRODUCTION_DATASET }}
        run: |
          set +e
          adpilot brief --out brief.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: hashFiles('brief.md') != ''
        with:
          name: brief-${{ github.run_id }}
          path: brief.md
          retention-days: 90
      - name: Open the issue
        if: hashFiles('brief.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Daily brief $(date -u +%F)" --body-file brief.md
      - name: Fail the job on a partial or unrecorded brief
        if: steps.brief.outputs.code != '0'
        run: exit 1
      - name: Data freshness gate
        if: always()
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_STAGING_DATASET: ${{ secrets.BQ_STAGING_DATASET }}
          BQ_PRODUCTION_DATASET: ${{ secrets.BQ_PRODUCTION_DATASET }}
        run: |
          python - <<'EOF'
          import datetime as dt, os
          from google.api_core.exceptions import NotFound
          from google.cloud import bigquery
          project = os.environ["BQ_PROJECT_ID"]
          bq = bigquery.Client(project=project)
          today = dt.datetime.now(dt.timezone.utc).date()
          gold = f"{project}.{os.environ['BQ_PRODUCTION_DATASET']}.fct_unified_marketing_performance"
          latest = next(iter(bq.query(f"SELECT MAX(date) AS d FROM `{gold}`").result())).d
          want = today - dt.timedelta(days=1)
          print(f"gold is complete through {latest}; the SLO wants {want}")
          # 02 commits gold before 03-07 run, so also require today's newest run to have passed all 6 steps.
          runs, batch = f"{project}.{os.environ['BQ_STAGING_DATASET']}.tbl_pipeline_runs", f"landing/{today.isoformat()}/"
          cfg = bigquery.QueryJobConfig(query_parameters=[bigquery.ScalarQueryParameter("batch", "STRING", batch)])
          sql = (f"SELECT step, ok FROM `{runs}` WHERE batch = @batch AND run_id = (SELECT run_id FROM `{runs}` "
                 "WHERE batch = @batch GROUP BY run_id ORDER BY MAX(started_at) DESC LIMIT 1)")
          try:
              steps = list(bq.query(sql, job_config=cfg).result())
          except NotFound:
              steps = []
          problems = [] if latest and latest >= want else [f"gold is stale: it ends {latest}, the SLO wants {want}"]
          if not steps:
              problems.append(f"no pipeline run recorded for {batch}")
          elif len(steps) < 6:
              problems.append(f"{batch}: the newest run has {len(steps)} of 6 steps")
          elif failed := [r.step for r in steps if not r.ok]:
              problems.append(f"{batch}: steps not ok: {', '.join(failed)}")
          print("\n".join(problems) or f"{batch}: newest run passed all 6 steps")
          raise SystemExit(1 if problems else 0)
          EOF
