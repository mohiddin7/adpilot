name: evals-nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  model-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # free-tier rate limits: a full model-tier run has taken ~3 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Audit preflight
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: adpilot audit preflight
      - name: Run model-tier evals
        id: evals
        env:
          LLM_BEARER_TOKEN: ${{ secrets.LLM_BEARER_TOKEN }}
          LLM_JUDGE_BEARER_TOKEN: ${{ secrets.LLM_JUDGE_BEARER_TOKEN }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          ADPILOT_INPUT_CLASSIFIER: ${{ secrets.JEV_API_KEY != '' && 'jev' || '' }}  # layer 1 on when the key exists; its cases are skipped otherwise
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: |
          set +e
          adpilot eval --tier model --out evals/reports
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "run_id=$(python -c "import json; print(json.load(open('evals/reports/latest.json')).get('run_id') or '')")" >> "$GITHUB_OUTPUT"
          git diff --quiet -- evals/reports/latest.json evals/reports/latest.md README.md && echo "fresh=false" >> "$GITHUB_OUTPUT" || echo "fresh=true" >> "$GITHUB_OUTPUT"
      - name: Export per-sample dump
        if: steps.evals.outputs.run_id != '' && steps.evals.outputs.fresh == 'true'
        continue-on-error: true
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: adpilot audit export --run "${{ steps.evals.outputs.run_id }}" > samples.jsonl
      - uses: actions/upload-artifact@v4
        if: steps.evals.outputs.run_id != '' && steps.evals.outputs.fresh == 'true'
        with:
          name: samples-${{ steps.evals.outputs.run_id }}
          path: samples.jsonl
          retention-days: 90
      - name: Render PR body
        run: |
          if [ "${{ steps.evals.outputs.fresh }}" = "true" ]; then
            python -m evals.pr_body evals/reports > /tmp/pr_body.md
            echo "" >> /tmp/pr_body.md
            echo "Per-sample dump: artifact \`samples-${{ steps.evals.outputs.run_id }}\` on this workflow run (90 days); permanent record: BigQuery \`adpilot_audit\` run \`${{ steps.evals.outputs.run_id }}\`." >> /tmp/pr_body.md
          else
            echo "adpilot eval --tier model exited ${{ steps.evals.outputs.code }} without writing a fresh report — nothing changed under evals/reports/, so there is no new scorecard to show. Check the job log for the failure." > /tmp/pr_body.md
          fi
          cat /tmp/pr_body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Decide label
        id: label
        run: |
          if [ "${{ steps.evals.outputs.code }}" = "0" ]; then echo "name=evals:refresh" >> "$GITHUB_OUTPUT"; else echo "name=evals:regression" >> "$GITHUB_OUTPUT"; fi
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Open or update the review PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: evals/nightly
          base: main
          add-paths: |
            evals/reports/latest.md
            evals/reports/latest.json
            README.md
          commit-message: "evals: nightly scorecard"
          title: "evals: nightly scorecard ${{ steps.label.outputs.date }}"
          body-path: /tmp/pr_body.md
          labels: ${{ steps.label.outputs.name }}
          delete-branch: true
      - name: Fail the job on regression
        if: steps.evals.outputs.code != '0'
        run: exit 1
