# AdPilot "ads" pack — everything the agent knows about paid-media data lives here.
# Swap this directory to point the same agent at a different domain.
name: ads
connector: duckdb                 # default; env ADPILOT_CONNECTOR or --connector overrides
date_column: date
max_result_rows: 100
max_bytes_billed: 10485760        # 10 MB per chat query (BigQuery only)

duckdb:
  csv_dir: data/raw
  init_sql: duckdb_setup.sql

bigquery:
  project_env: BQ_PROJECT_ID
  project_default: adpilot-lakehouse
  staging_env: BQ_STAGING_DATASET
  staging_default: adpilot_staging
  production_env: BQ_PRODUCTION_DATASET
  production_default: adpilot_production

# Logical name -> physical reference per connector. {project}/{staging}/{production}
# resolve from the env vars above. Only these tables are queryable.
tables:
  gold:
    duckdb: fct_unified_marketing_performance
    bigquery: "{project}.{production}.fct_unified_marketing_performance"
    description: Daily campaign-level facts for every platform. Use for almost every question.
    columns:
      date: campaign date (partition key)
      platform: one of Facebook | Google | TikTok
      campaign_id: platform-native campaign identifier
      campaign_name: human-readable campaign name
      sub_group_id: ad set (Facebook) / ad group (Google) / adgroup (TikTok) id
      sub_group_name: human-readable sub-group name
      impressions: ad impressions served
      clicks: ad clicks
      spend: cost in USD
      conversions: conversion events
      conversion_value: attributed revenue in USD (Google only; 0 elsewhere)
      video_views: video view events (Facebook + TikTok; 0 for Google)
      video_watch_25: viewers reaching 25% (TikTok only)
      video_watch_50: viewers reaching 50% (TikTok only)
      video_watch_75: viewers reaching 75% (TikTok only)
      video_watch_100: viewers reaching 100% (TikTok only)
      likes: post likes (TikTok only)
      shares: post shares (TikTok only)
      comments: post comments (TikTok only)
      reach: unique users reached (Facebook only)
      frequency: avg impressions per user (Facebook only)
      quality_score: Google quality score 1-10 (0 when n/a)
      search_impression_share: share of eligible search impressions 0-1 (Google only)
      avg_cpc: Google-reported average cost per click (0 elsewhere)
      engagement_rate: (likes + shares + comments) / impressions
      cpa: spend / conversions (NULL when no conversions)
      ctr: clicks / impressions
      cpc: spend / clicks
      cpm: spend / impressions * 1000
      roas: conversion_value / spend (Google only)
  anomalies:
    duckdb: fct_anomaly_flags
    bigquery: "{project}.{staging}.fct_anomaly_flags"
    description: Robust (median/MAD) anomaly flags per (date, platform, campaign) on cost per acquisition.
    columns:
      date: date of the observation
      platform: platform
      campaign_id: campaign id
      campaign_name: campaign name
      observed_cpa: CPA on that day
      rolling_mean_cpa: baseline median CPA over the baseline window (name kept for compatibility)
      rolling_std_cpa: baseline median absolute deviation (MAD) of CPA (name kept for compatibility)
      z_score: modified z-score = 0.6745 * (observed - median) / MAD (same value as modified_z_score)
      is_anomaly: 1 when severity is not NORMAL
      anomaly_direction: HIGH_CPA (CPA spiked) | LOW_CPA (CPA dropped) | NORMAL
      modified_z_score: modified z-score (duplicate of z_score, explicit name)
      severity: NORMAL | MODERATE (|z| >= 3.5) | SEVERE (|z| >= 4.5) | CRITICAL (|z| >= 6.0)
      baseline_method: rolling_14d | day_of_week | insufficient_history (fewer than 7 prior points)
      baseline_size: number of prior observations in the baseline
      confidence: low | medium | high — how much history backed the flag
      days_of_history: days of campaign history available on that date
  budget:
    duckdb: tbl_budget_recommendations
    bigquery: "{project}.{staging}.tbl_budget_recommendations"
    description: Linear-programming budget reallocation, one row per platform, computed over a 30-day lookback.
    columns:
      generated_at: UTC timestamp when the optimizer produced this plan
      analysis_period_start: first day of the 30-day lookback window the plan is based on
      analysis_period_end: last day of the lookback window
      platform: platform
      current_spend: spend in the lookback window, USD
      current_spend_pct: current share of total spend (percent)
      current_conversions: conversions in the lookback window
      current_cpa: current_spend / current_conversions over the window (assumed constant by the optimizer)
      recommended_spend: recommended spend USD
      recommended_spend_pct: recommended share of total (percent)
      projected_conversions: conversions expected at recommended spend
      conversion_delta: projected minus current conversions
      assumption_note: text describing optimizer assumptions and constraints (floor 10%, cap 2x)
  forecast:
    duckdb: tbl_forecast
    bigquery: "{project}.{staging}.tbl_forecast"
    description: 14-day Holt-Winters forecast per platform and metric.
    columns:
      forecast_execution_date: when the forecast was produced
      target_date: forecasted date
      platform: platform
      metric_name: forecasted metric (e.g. spend)
      predicted_value: point forecast
      lower_bound: lower confidence bound
      upper_bound: upper confidence bound
      model_used: model identifier

# Deterministic answers used when every model in the chain is unavailable.
# First entry whose keywords (regex, case-insensitive) all match the question wins. {gold} etc. are rendered.
fallback_queries:
  - keywords: [spend, platform]
    title: Total spend by platform
    sql: SELECT platform, ROUND(SUM(spend), 2) AS spend FROM {gold} GROUP BY platform ORDER BY spend DESC
  - keywords: [worst|highest|expensive, "cpa|cost per acquisition|acquisition"]
    title: Campaigns ranked by cost per acquisition (worst first)
    sql: >-
      SELECT platform, campaign_name, ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions,
      ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa FROM {gold}
      GROUP BY platform, campaign_name HAVING SUM(conversions) > 0 ORDER BY cpa DESC LIMIT 10
  - keywords: ["cpa|cost per acquisition|acquisition"]
    title: Cost per acquisition by platform
    sql: >-
      SELECT platform, ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions,
      ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa FROM {gold} GROUP BY platform ORDER BY cpa
  - keywords: [conversion]
    title: Conversions by platform
    sql: SELECT platform, SUM(conversions) AS conversions FROM {gold} GROUP BY platform ORDER BY conversions DESC
  - keywords: [spend]
    title: Total spend by platform
    sql: SELECT platform, ROUND(SUM(spend), 2) AS spend FROM {gold} GROUP BY platform ORDER BY spend DESC

# The daily brief (adpilot brief). Code computes every fact from the tables above; the model only words it.
# budgets: monthly USD per platform, for month-end pacing. Demo values: August 2026 actual spend, rounded to $1K.
# thresholds: any key left out uses the default in adpilot/brief/__init__.py (DEFAULTS); unknown keys are errors.
briefing:
  budgets:
    Facebook: 24000
    Google: 58000
    TikTok: 61000
  thresholds:
    cost_rise_pct: 15          # a platform's weekly cost per sale rose at least this much
    min_conversions: 30        # ...on at least this many sales in each week
    anomaly_persist_usd: 100   # a flag that persists needs you from this much at stake
    anomaly_any_usd: 500       # any flag needs you from this much at stake
    tracking_drop_ratio: 0.5   # sales at or below half of normal with normal clicks = tracking or landing page
    double_count_ratio: 3.0    # sales at 3x normal with normal clicks = double counting
    max_items: 3
    mover_min_usd: 500         # /insights: a spend or cost-per-sale move needs this much at stake...
    mover_min_pct: 20          # /insights: ...and at least this relative change
    mover_min_conversions: 10  # /insights: a cost-per-sale move needs this many sales in both windows
    outlier_min_share_pct: 5   # /insights: an efficiency outlier takes at least this share of the window's spend...
    outlier_cpa_pct: 25        # /insights: ...at a cost per sale at least this far above the account's
    mix_gap_pts: 10            # /insights: share of spend minus share of sales, in points

# The dashboard (streamlit_app/, via adpilot-api /dashboard, /filters, /panels, /pacing). Pack-authored SQL only.
# {where} becomes: the viewer's date range + every filter they set that lists the panel's `table`. A panel without
# {where} ignores filters (pipeline outputs that are already one snapshot). Values are validated, then quoted per
# dialect (adpilot/dashboard/filters.py); the finished SQL still goes through validate_sql. SQL here must run on
# both DuckDB and BigQuery: no EXTRACT(... FROM ...) (validate_sql reads the FROM as a table); SAFE_DIVIDE and
# FORMAT_DATE are DuckDB macros in duckdb_setup.sql. Every panel names a `role` (how the UI lays it out) and may
# name `formats` (how its numeric columns are displayed). `colors` pins one series colour per platform.
dashboard:
  max_rows: 2000
  cache_ttl_s: 900
  colors: {Facebook: brand, Google: forecast, TikTok: audited}
  insights:
    - Which platform had the best cost per acquisition in this period, and by how much?
    - Which three campaigns spent the most for the fewest conversions?
    - Where did spend change the most compared with the previous period of the same length?
    - Is any platform's click-through rate falling?
  filters:
    - {column: platform, label: Platform, type: categorical, tables: [gold, anomalies], pages: [overview, deep_dive], values: [Facebook, Google, TikTok]}
    - {column: campaign_name, label: Campaign, type: categorical, tables: [gold, anomalies], pages: [overview, deep_dive], depends_on: platform}
    - {column: sub_group_name, label: Ad set / ad group, type: categorical, tables: [gold], pages: [deep_dive], depends_on: campaign_name}
    - {column: severity, label: Anomaly severity, type: categorical, tables: [anomalies], pages: [deep_dive], values: [MODERATE, SEVERE, CRITICAL]}
    - {column: confidence, label: Anomaly confidence, type: categorical, tables: [anomalies], pages: [deep_dive], values: [low, medium, high]}
    - {column: anomaly_direction, label: Anomaly direction, type: categorical, tables: [anomalies], pages: [deep_dive], values: [HIGH_CPA, LOW_CPA]}
    - {column: spend, label: Daily spend per campaign (USD), type: range, tables: [gold], pages: [deep_dive]}
    - {column: impressions, label: Daily impressions per campaign, type: range, tables: [gold], pages: [deep_dive]}
    - {column: clicks, label: Daily clicks per campaign, type: range, tables: [gold], pages: [deep_dive]}
    - {column: conversions, label: Daily conversions per campaign, type: range, tables: [gold], pages: [deep_dive]}
    - {column: cpa, label: Daily cost per acquisition (USD), type: range, tables: [gold], pages: [deep_dive]}
    - {column: ctr, label: Daily click-through rate, type: range, tables: [gold], pages: [deep_dive]}
    - {column: roas, label: Daily return on ad spend, type: range, tables: [gold], pages: [deep_dive], platforms: [Google]}
    - {column: quality_score, label: Quality score (1-10), type: range, tables: [gold], pages: [deep_dive], platforms: [Google]}
    - {column: search_impression_share, label: Search impression share, type: range, tables: [gold], pages: [deep_dive], platforms: [Google]}
    - {column: frequency, label: Frequency (impressions per person), type: range, tables: [gold], pages: [deep_dive], platforms: [Facebook]}
  panels:
    # ---------- overview ----------
    - id: kpis
      title: Headline numbers
      page: overview
      kind: kpi
      role: kpi
      formats: {spend: currency, conversions: number, cpa: currency, roas_google: multiple, ctr: percent, cvr: percent}
      sql: >-
        SELECT ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions,
        ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa,
        ROUND(SAFE_DIVIDE(SUM(CASE WHEN platform = 'Google' THEN conversion_value END),
        SUM(CASE WHEN platform = 'Google' THEN spend END)), 2) AS roas_google,
        ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)), 4) AS ctr,
        ROUND(SAFE_DIVIDE(SUM(conversions), SUM(clicks)), 4) AS cvr
        FROM {gold} WHERE {where}
    - id: kpi_daily
      title: Daily trend
      page: overview
      kind: chart
      role: kpi_series
      chart: {chart_type: line, x: date, y: spend}
      formats: &daily_formats {spend: currency, conversions: number, cpa: currency, roas_google: multiple, ctr: percent, cvr: percent, cpc: currency, cpm: currency}
      sql: &daily_sql >-
        SELECT date, ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions,
        ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa,
        ROUND(SAFE_DIVIDE(SUM(CASE WHEN platform = 'Google' THEN conversion_value END),
        SUM(CASE WHEN platform = 'Google' THEN spend END)), 2) AS roas_google,
        ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)), 4) AS ctr,
        ROUND(SAFE_DIVIDE(SUM(conversions), SUM(clicks)), 4) AS cvr,
        ROUND(SAFE_DIVIDE(SUM(spend), SUM(clicks)), 2) AS cpc,
        ROUND(SAFE_DIVIDE(SUM(spend) * 1000.0, SUM(impressions)), 2) AS cpm
        FROM {gold} WHERE {where} GROUP BY date ORDER BY date
    - id: cpa_trend
      title: Cost per acquisition by platform
      page: overview
      kind: chart
      role: trend
      chart: {chart_type: line, x: date, y: cpa, color: platform}
      formats: {cpa: currency}
      sql: >-
        SELECT date, platform, ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa FROM {gold}
        WHERE {where} GROUP BY date, platform ORDER BY date, platform
    - id: efficiency
      title: Efficiency map (spend vs cost per acquisition, sized by conversions)
      page: overview
      kind: chart
      role: map
      chart: {chart_type: bubble, x: spend, y: cpa, size: conversions, color: platform, reference: mean_y}
      formats: {spend: currency, conversions: number, cpa: currency}
      sql: >-
        SELECT platform, campaign_name, ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions,
        ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa
        FROM {gold} WHERE {where} GROUP BY platform, campaign_name HAVING SUM(conversions) > 0 ORDER BY spend DESC
    - id: mix
      title: Share of spend vs share of conversions
      page: overview
      kind: chart
      role: compare
      chart: {chart_type: bar, x: platform, y: share, color: measure}
      formats: {share: percent}
      sql: >-
        WITH p AS (SELECT platform, SUM(spend) AS spend, SUM(conversions) AS conversions FROM {gold} WHERE {where}
        GROUP BY platform)
        SELECT platform, 'Share of spend' AS measure, ROUND(SAFE_DIVIDE(spend, (SELECT SUM(spend) FROM p)), 4) AS share
        FROM p
        UNION ALL
        SELECT platform, 'Share of conversions', ROUND(SAFE_DIVIDE(conversions, (SELECT SUM(conversions) FROM p)), 4)
        FROM p
        ORDER BY platform, measure
    - id: funnel
      title: Funnel
      page: overview
      kind: chart
      role: funnel
      chart: {chart_type: funnel, x: stage, y: value}
      formats: {value: number}
      sql: >-
        WITH t AS (SELECT SUM(impressions) AS i, SUM(clicks) AS c, SUM(conversions) AS v FROM {gold} WHERE {where})
        SELECT '1. Impressions' AS stage, i AS value FROM t
        UNION ALL SELECT '2. Clicks', c FROM t
        UNION ALL SELECT '3. Conversions', v FROM t
        ORDER BY stage
    - id: budget_plan
      title: Budget optimizer, current vs recommended spend
      page: overview
      kind: chart
      role: compare
      table: budget
      chart: {chart_type: bar, x: platform, y: spend, color: plan}
      formats: {spend: currency}
      sql: >-
        SELECT platform, 'current' AS plan, ROUND(current_spend, 2) AS spend FROM {budget}
        WHERE generated_at = (SELECT MAX(generated_at) FROM {budget})
        UNION ALL
        SELECT platform, 'recommended' AS plan, ROUND(recommended_spend, 2) AS spend FROM {budget}
        WHERE generated_at = (SELECT MAX(generated_at) FROM {budget})
        ORDER BY platform, plan
    - id: attention
      title: Needs attention
      page: overview
      kind: table
      role: attention
      table: anomalies
      formats: &attention_formats {flagged_days: number, excess_cost: currency}
      # The flag rule (spec 3.1.5): SEVERE/CRITICAL days only; the API anchors {where}'s dates on the last 7 days
      # of data (panels.last_week). Excess cost = (observed - usual CPA) x that day's conversions, from gold.
      sql: &attention_sql >-
        WITH f AS (SELECT date, platform, campaign_id, campaign_name, severity, observed_cpa, rolling_mean_cpa
        FROM {anomalies} WHERE {where} AND severity IN ('SEVERE', 'CRITICAL')),
        d AS (SELECT f.date, f.platform, f.campaign_name, f.severity, f.observed_cpa, f.rolling_mean_cpa,
        SUM(g.conversions) AS conversions FROM f JOIN {gold} g ON g.date = f.date AND g.platform = f.platform
        AND g.campaign_id = f.campaign_id
        GROUP BY f.date, f.platform, f.campaign_name, f.severity, f.observed_cpa, f.rolling_mean_cpa)
        SELECT platform, campaign_name,
        CASE WHEN SUM(CASE WHEN severity = 'CRITICAL' THEN 1 ELSE 0 END) > 0 THEN 'CRITICAL' ELSE 'SEVERE' END AS worst,
        COUNT(*) AS flagged_days, MAX(date) AS last_flagged,
        ROUND(SUM((observed_cpa - rolling_mean_cpa) * conversions), 2) AS excess_cost
        FROM d GROUP BY platform, campaign_name ORDER BY excess_cost DESC LIMIT 10
    # ---------- channel deep dive ----------
    - id: dd_kpis
      title: Headline numbers
      page: deep_dive
      kind: kpi
      role: kpi
      formats: {spend: currency, conversions: number, cpa: currency, roas_google: multiple, ctr: percent, cvr: percent}
      sql: >-
        SELECT ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions,
        ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa,
        ROUND(SAFE_DIVIDE(SUM(CASE WHEN platform = 'Google' THEN conversion_value END),
        SUM(CASE WHEN platform = 'Google' THEN spend END)), 2) AS roas_google,
        ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)), 4) AS ctr,
        ROUND(SAFE_DIVIDE(SUM(conversions), SUM(clicks)), 4) AS cvr
        FROM {gold} WHERE {where}
    - id: dd_google_kpis
      title: Google search
      page: deep_dive
      kind: kpi
      role: kpi
      platforms: [Google]
      formats: {quality_score: number, impression_share: percent}
      sql: >-
        SELECT ROUND(AVG(CASE WHEN quality_score > 0 THEN quality_score END), 1) AS quality_score,
        ROUND(AVG(search_impression_share), 4) AS impression_share FROM {gold} WHERE {where}
    - id: dd_facebook_kpis
      title: Facebook reach
      page: deep_dive
      kind: kpi
      role: kpi
      platforms: [Facebook]
      formats: {frequency: number}
      sql: SELECT ROUND(AVG(frequency), 2) AS frequency FROM {gold} WHERE {where}
    - id: dd_daily
      title: Trend explorer
      page: deep_dive
      kind: chart
      role: kpi_series
      chart: {chart_type: line, x: date, y: spend}
      formats: *daily_formats
      sql: *daily_sql
    - id: dd_markers
      title: Anomaly timeline
      page: deep_dive
      kind: chart
      role: markers
      table: anomalies
      chart: {chart_type: scatter, x: date, y: campaign_name, color: severity}
      formats: {observed_cpa: currency, usual_cpa: currency}
      sql: >-
        SELECT date, platform, campaign_name, severity, ROUND(observed_cpa, 2) AS observed_cpa,
        ROUND(rolling_mean_cpa, 2) AS usual_cpa FROM {anomalies} WHERE {where} AND is_anomaly = 1 ORDER BY date
    - id: dd_attention
      title: Needs attention
      page: deep_dive
      kind: table
      role: attention
      table: anomalies
      formats: *attention_formats
      sql: *attention_sql
    - id: dd_campaigns
      title: Campaigns
      page: deep_dive
      kind: table
      role: details
      formats: {spend: currency, impressions: number, clicks: number, conversions: number, cpa: currency, ctr: percent, roas: multiple}
      sql: >-
        SELECT platform, campaign_name, ROUND(SUM(spend), 2) AS spend, SUM(impressions) AS impressions,
        SUM(clicks) AS clicks, SUM(conversions) AS conversions,
        ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa,
        ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)), 4) AS ctr,
        ROUND(SAFE_DIVIDE(SUM(conversion_value), SUM(spend)), 2) AS roas
        FROM {gold} WHERE {where} GROUP BY platform, campaign_name ORDER BY spend DESC
    - id: dd_subgroups
      title: Ad sets / ad groups
      page: deep_dive
      kind: table
      role: details
      formats: {spend: currency, clicks: number, conversions: number, cpa: currency}
      sql: >-
        SELECT platform, campaign_name, sub_group_name, ROUND(SUM(spend), 2) AS spend, SUM(clicks) AS clicks,
        SUM(conversions) AS conversions, ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa
        FROM {gold} WHERE {where} GROUP BY platform, campaign_name, sub_group_name ORDER BY spend DESC
    - id: dd_weekday
      title: Day of week
      page: deep_dive
      kind: chart
      role: heatmap
      chart: {chart_type: heatmap, x: weekday, y: platform, z: spend}
      formats: {spend: currency, cpa: currency, ctr: percent}
      sql: >-
        SELECT FORMAT_DATE('%a', date) AS weekday, platform, ROUND(SUM(spend), 2) AS spend,
        ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa,
        ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)), 4) AS ctr
        FROM {gold} WHERE {where} GROUP BY weekday, platform
    - id: google_quality_dist
      title: Spend by quality score
      page: deep_dive
      kind: chart
      role: platform
      platforms: [Google]
      chart: {chart_type: bar, x: quality_score, y: spend}
      formats: {quality_score: number, spend: currency}
      sql: >-
        SELECT quality_score, ROUND(SUM(spend), 2) AS spend FROM {gold} WHERE {where} AND quality_score > 0
        GROUP BY quality_score ORDER BY quality_score
    - id: google_impression_share
      title: Search impression share
      page: deep_dive
      kind: chart
      role: platform
      platforms: [Google]
      chart: {chart_type: line, x: date, y: search_impression_share}
      formats: {search_impression_share: percent}
      sql: >-
        SELECT date, ROUND(AVG(search_impression_share), 3) AS search_impression_share
        FROM {gold} WHERE {where} GROUP BY date ORDER BY date
    - id: facebook_fatigue
      title: Ad fatigue (frequency vs click-through rate)
      page: deep_dive
      kind: chart
      role: platform
      platforms: [Facebook]
      chart: {chart_type: scatter, x: frequency, y: ctr}
      formats: {frequency: number, ctr: percent}
      sql: >-
        SELECT date, campaign_name, ROUND(AVG(frequency), 2) AS frequency,
        ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)), 4) AS ctr
        FROM {gold} WHERE {where} GROUP BY date, campaign_name ORDER BY date
    - id: tiktok_video_funnel
      title: Video completion funnel
      page: deep_dive
      kind: chart
      role: platform
      platforms: [TikTok]
      chart: {chart_type: funnel, x: stage, y: viewers}
      formats: {viewers: number}
      sql: >-
        WITH funnel AS (SELECT SUM(video_views) AS v0, SUM(video_watch_25) AS v25, SUM(video_watch_50) AS v50,
        SUM(video_watch_75) AS v75, SUM(video_watch_100) AS v100 FROM {gold} WHERE {where})
        SELECT '1. Viewed' AS stage, v0 AS viewers FROM funnel
        UNION ALL SELECT '2. Watched 25%', v25 FROM funnel
        UNION ALL SELECT '3. Watched 50%', v50 FROM funnel
        UNION ALL SELECT '4. Watched 75%', v75 FROM funnel
        UNION ALL SELECT '5. Watched 100%', v100 FROM funnel
        ORDER BY stage
