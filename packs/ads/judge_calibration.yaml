  # ---- general analytics concepts + strategy in suggestion voice ----
  - name: cal_pass_define_kpi
    question: What is a KPI?
    data: []
    answer: "A Key Performance Indicator (KPI) is the one or two numbers you watch to know if something is working. For paid ads the usual KPIs are Cost per Acquisition (CPA, what each result costs you) and, where revenue is tracked, Return on Ad Spend (ROAS, revenue back per dollar spent). Pick the one that matches your goal: cheap results, or profitable ones."
    verdict: pass
  - name: cal_pass_define_funnel
    question: What is a funnel?
    data: []
    answer: "A funnel is the path from someone seeing your ad to becoming a customer, and it narrows at each step: impressions (people who saw it), clicks (people who were interested), conversions (people who signed up or bought). Looking at where the biggest drop-off happens tells you what to fix: a low Click-Through Rate means the ad isn't catching attention; lots of clicks but few conversions points to the landing page or offer."
    verdict: pass
  - name: cal_pass_strategy_suggestion_grounded
    question: Should I move budget between platforms?
    data: [{platform: TikTok, spend: 74266.7, cpa: 11.0}, {platform: Google, spend: 37686.2, cpa: 8.93}, {platform: Facebook, spend: 18292.0, cpa: 7.64}]
    answer: "Worth considering. Facebook gets results cheapest (Cost per Acquisition $7.64) but has the smallest budget ($18.3K), while TikTok has the largest budget ($74.3K) and the highest CPA ($11.00). A cautious next step would be shifting a small slice of TikTok's budget to Facebook and checking whether Facebook's CPA holds as it scales; it often rises when spend grows, and this data can't tell you where that ceiling is."
    verdict: pass
  - name: cal_pass_strategy_general_no_data
    question: In general, how should a beginner split a budget across platforms?
    data: []
    answer: "As a general starting point rather than a rule: spread the budget so every platform gets enough to produce measurable results, run it for a few weeks, then move money toward whichever platform delivers your goal most cheaply (Cost per Acquisition) or most profitably (Return on Ad Spend). Your own data is the better guide once it exists; I can compare the platforms here whenever you're ready."
    verdict: pass
