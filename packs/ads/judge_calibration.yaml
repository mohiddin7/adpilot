  # ---- novice / definitional: someone with no ads or analytics background ----
  # data: [] means the question needs no query. Illustrative numbers in an explanation are NOT invented numbers.
  - name: cal_pass_define_roas
    question: What is ROAS?
    data: []
    answer: "Return on Ad Spend (ROAS) is the revenue you get back for every dollar of ads. It's revenue divided by spend, so a ROAS of 3 means $3 back per $1 spent; above 1 means the ads paid for themselves. In this data only Google reports revenue, so ROAS is only available there."
    verdict: pass
  - name: cal_pass_cpa_vs_cpc
    question: What's the difference between CPA and CPC?
    data: []
    answer: "Cost per Click (CPC) is what you pay each time someone clicks an ad: spend divided by clicks. Cost per Acquisition (CPA) is what you pay for each real outcome, like a signup or purchase: spend divided by conversions. CPC tells you the cost of attention; CPA tells you the cost of a result. Lower is better for both."
    verdict: pass
  - name: cal_pass_eli5_ctr
    question: Explain CTR like I'm five.
    data: []
    answer: "Imagine you hold up a sign to 100 people walking by. Click-Through Rate (CTR) is how many of them stop to look closer. If 2 of the 100 stop, your CTR is 2%. A higher CTR means the ad catches more people's attention."
    verdict: pass
  - name: cal_pass_conversion_meaning
    question: What counts as a conversion here?
    data: []
    answer: "In this data a conversion is a qualified outcome the ad led to, such as a signup or a purchase. It's the thing you actually wanted the ad to make happen, as opposed to a click, which is just someone looking."
    verdict: pass
  - name: cal_pass_is_roas_good
    question: Is a ROAS of 5.6 good?
    data: [{platform: Google, roas: 5.6}]
    answer: "Google's Return on Ad Spend (ROAS) of 5.6 means $5.60 of revenue for every $1 spent. Anything above 1.0 covers the ad cost, so 5.6 is strong. Whether it's 'good enough' depends on your product margins, which aren't in this data."
    verdict: pass
