  - {name: sc_weather, family: scope, question: "What's the weather in Berlin tomorrow?", expected: {refuse: true}}
  - {name: sc_poem, family: scope, question: "Write me a poem about autumn.", expected: {refuse: true}}
  - {name: sc_general_knowledge, family: scope, question: "Who invented the telephone?", expected: {refuse: true}}
  - {name: sc_on_topic_slang, family: scope, question: "Which channel is burning cash without converting?", expected: {refuse: false}}
  - {name: sc_on_topic_history, family: scope, question: "Over the history of our marketing data, which platform improved its CTR the most week over week?", expected: {refuse: false}}
  - {name: sc_on_topic_meta, family: scope, question: "What tables and metrics can you answer questions about?", expected: {refuse: false}}
  - {name: sc_on_topic_drop_verb, family: scope, question: "Which campaigns should we drop next quarter?", expected: {refuse: false}}
  - {name: sc_on_topic_update_verb, family: scope, question: "Did spend update after the last sync?", expected: {refuse: false}}
  - {name: sc_on_topic_schema_plain, family: scope, question: "Which tables and columns do you use to compute CPA?", expected: {refuse: false}}
  - {name: sc_on_topic_accented, family: scope, question: "How did the Café Noir campaign perform in Zürich?", expected: {refuse: false}}
  - {name: sc_on_topic_currency, family: scope, question: "Show spend in € and £ by platform.", expected: {refuse: false}}
  - {name: sc_on_topic_table_name, family: scope, question: "What is total spend in fct_unified_marketing_performance by platform?", expected: {refuse: false}}
  # ---------- narrative (10): judged with rubric; sql gives the judge grounding data ----------
  - name: nr_platform_comparison
    family: narrative
    question: How did TikTok perform compared to Facebook this month?
    expected: {sql: "SELECT platform, ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions, ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa FROM {gold} WHERE platform IN ('TikTok', 'Facebook') GROUP BY platform", rubric: "Compares TikTok and Facebook on at least two of spend, conversions, CPA; every number matches the data; names which is more efficient."}
  - name: nr_where_to_cut
    family: narrative
    question: If I had to cut 10% of the budget, where should it come from and why?
    expected: {sql: "SELECT platform, campaign_name, ROUND(SUM(spend), 2) AS spend, ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa FROM {gold} GROUP BY 1, 2 HAVING SUM(conversions) > 0 ORDER BY cpa DESC", rubric: "Recommends cutting from high-CPA campaigns or platforms, cites their CPA from the data, and states an assumption or caveat (e.g. constant CPA)."}
  - name: nr_google_summary
    family: narrative
    question: Summarize Google Ads performance.
    expected: {sql: "SELECT ROUND(SUM(spend), 2) AS spend, SUM(conversions) AS conversions, ROUND(SAFE_DIVIDE(SUM(conversion_value), SUM(spend)), 2) AS roas, ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)) * 100, 2) AS ctr_pct FROM {gold} WHERE platform = 'Google'", rubric: "Mentions spend, conversions and ROAS for Google with values matching the data; does not invent metrics Google lacks (e.g. video views)."}
  - name: nr_efficiency
    family: narrative
    question: Which platform is the most efficient and what does that mean for us?
    expected: {sql: "SELECT platform, ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa, ROUND(SAFE_DIVIDE(SUM(spend), SUM(clicks)), 2) AS cpc FROM {gold} GROUP BY platform ORDER BY cpa", rubric: "Defines efficiency (CPA and/or CPC), names Facebook as lowest CPA with the correct value, and gives an actionable implication."}
  - name: nr_tiktok_video
    family: narrative
    question: Is our TikTok video content holding attention?
    expected: {sql: "SELECT SUM(video_views) AS views, ROUND(SAFE_DIVIDE(SUM(video_watch_100), SUM(video_views)) * 100, 2) AS completion_pct, ROUND(SAFE_DIVIDE(SUM(video_watch_50), SUM(video_views)) * 100, 2) AS half_pct FROM {gold} WHERE platform = 'TikTok'", rubric: "Uses completion or watch-percentage metrics with correct values, interprets whether attention holds, and does not compare to platforms lacking video metrics."}
  - name: nr_campaign_outlier
    family: narrative
    question: Are there any campaigns that look like outliers on cost?
    expected: {sql: "SELECT platform, campaign_name, ROUND(SAFE_DIVIDE(SUM(spend), SUM(conversions)), 2) AS cpa FROM {gold} GROUP BY 1, 2 HAVING SUM(conversions) > 0 ORDER BY cpa DESC", rubric: "Identifies Search_Generic_Terms (CPA 24.8) as the cost outlier, cites the number, and contrasts with the typical CPA."}
  - name: nr_anomaly_explain
    family: narrative
    tool: get_anomalies
    question: Explain the most severe CPA anomaly we detected.
    expected: {sql: "SELECT date, platform, campaign_name, observed_cpa, rolling_mean_cpa, z_score, anomaly_direction FROM {anomalies} WHERE is_anomaly = 1 ORDER BY ABS(z_score) DESC LIMIT 1", rubric: "Names the campaign, date and direction of the top anomaly, quotes observed vs baseline CPA from the data, and explains what a z-score of that size means."}
  - name: nr_budget_explain
    family: narrative
    tool: get_budget_plan
    question: Walk me through the budget recommendation and its risks.
    expected: {sql: "SELECT platform, current_spend, recommended_spend, conversion_delta FROM {budget} ORDER BY conversion_delta DESC", rubric: "States which platforms gain and lose budget with correct amounts, gives the projected conversion delta, and mentions at least one modelling assumption or risk."}
  - name: nr_forecast_explain
    family: narrative
    tool: get_forecast
    question: What does the forecast say about next week's spend?
    expected: {sql: "SELECT platform, ROUND(SUM(predicted_value), 2) AS predicted FROM {forecast} WHERE metric_name = 'spend' GROUP BY platform ORDER BY predicted DESC", rubric: "Reports forecasted spend per platform from the forecast data, mentions uncertainty bounds, and does not present the forecast as certain."}
  - name: nr_ctr_story
