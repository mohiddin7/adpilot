[project]
name = "adpilot"
version = "0.1.0"
description = "An AI analyst for ad spend: plain-English questions in, guarded read-only SQL, an answer and a chart out. A daily brief, a Streamlit dashboard, a FastAPI service and an MCP server over BigQuery or DuckDB."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mohiddin7" }]
keywords = [
  "ai-agent", "marketing-analytics", "ad-spend", "advertising-analytics", "text-to-sql",
  "natural-language-to-sql", "llm", "bigquery", "duckdb", "pydantic-ai", "openrouter",
  "mcp", "model-context-protocol", "streamlit", "fastapi", "llm-evals", "guardrails",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "streamlit>=1.64,<1.65",  # see requirements.txt
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "db-dtypes>=1.3",
  "google-cloud-bigquery>=3.30",
  "google-cloud-storage>=3.0",
  "plotly>=6.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "sqlparse>=0.5",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "pydantic-ai-slim[openrouter]>=2.43",
  "duckdb>=1.5",
  "pyyaml>=6",
  "pydantic-evals>=2.43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "adpilot[api,mcp]"]
api = ["fastapi>=0.115", "uvicorn>=0.53"]
mcp = ["mcp>=2.2,<3"]
logfire = ["logfire>=5"]

[project.urls]
Homepage = "https://github.com/mohiddin7/adpilot"
Demo = "https://adpilot.streamlit.app/"
Documentation = "https://github.com/mohiddin7/adpilot/tree/main/docs"
Source = "https://github.com/mohiddin7/adpilot"
Issues = "https://github.com/mohiddin7/adpilot/issues"

[project.scripts]
adpilot = "adpilot.cli:main"

[build-system]
requires = ["setuptools>=77"]  # 77 reads the SPDX `license = "MIT"` above
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adpilot*", "evals*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Legacy code: syntax errors + pyflakes only; cleaned up when deleted in Phase 3.
"pipelines/*" = ["E", "I", "UP", "B", "F401"]

[tool.pytest.ini_options]
testpaths = ["pipelines/tests", "tests"]
