[project]
name = "adpilot"
version = "0.1.0"
description = "Agentic marketing analytics: data-agnostic AI analyst over BigQuery with evals and self-healing guardrails"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "db-dtypes>=1.3",
  "google-cloud-bigquery>=3.30",
  "google-cloud-storage>=3.0",
  "plotly>=6.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "sqlparse>=0.5",
  "requests>=2.32",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["streamlit_app/pages"]

[tool.ruff.lint]
select = ["E9", "F"]   # syntax errors + pyflakes; widen in Phase 1
ignore = ["F401"]      # unused imports in legacy scripts; clean up in Phase 1

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
