[project]
name = "adpilot"
version = "0.1.0"
description = "Agentic marketing analytics: data-agnostic AI analyst over BigQuery with evals and self-healing guardrails"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "db-dtypes>=1.3",
  "google-cloud-bigquery>=3.30",
  "google-cloud-storage>=3.0",
  "plotly>=6.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "sqlparse>=0.5",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "pydantic-ai-slim[openrouter]>=2.43",
  "duckdb>=1.5",
  "pyyaml>=6",
  "pydantic-evals>=2.43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "adpilot[api,mcp]"]
api = ["fastapi>=0.115", "uvicorn>=0.53"]
mcp = ["mcp>=2.2,<3"]
logfire = ["logfire>=5"]

[project.scripts]
adpilot = "adpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adpilot*", "evals*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["streamlit_app/pages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Legacy code: syntax errors + pyflakes only; cleaned up when deleted in Phase 3.
"pipelines/*" = ["E", "I", "UP", "B", "F401"]
"streamlit_app/*" = ["E", "I", "UP", "B", "F401"]

[tool.pytest.ini_options]
testpaths = ["pipelines/tests", "tests"]
